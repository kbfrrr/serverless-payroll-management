service: payroll-api-ferrer

provider:
  name: aws
  region: ap-southeast-1
  stage: dev
  memorySize: 1024
  logRetentionInDays: 7
  environment:
    PAYSLIP_BUCKET: ${env:PAYSLIP_BUCKET}
  iam:
    role: ${env:PAYROLL_ROLE_ARN}

functions:
  api:
    handler: index.php
    runtime: php-82-fpm
    timeout: 28
    events:
      - httpApi: '*'

package:
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.aws/**'
    - '!.env*'
    - '!artifacts/**'
    - '!screenshots/**'
    - '!tools/**'
    - '!policies/**'
    - '!README.md'
    - '!SUBMISSION.md'
    - '!*.log'

plugins:
  - ./vendor/bref/bref
